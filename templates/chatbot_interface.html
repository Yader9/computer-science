<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Coach</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de Estilos Personalizada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="d-flex flex-column h-100">
    <!-- Pantalla de Introducción -->
    <div id="introScreen" class="text-center flex-grow-1"> 
        <h1 id="chatbotTitle">Gym Coach</h1>
        <img src="{{ url_for('static', filename='img/pcb_chatbot_1.png') }}" alt="PCB ChatBot Logo" class="img-fluid custom-logo-size mx-auto d-block mt-4">
        <button id="startChatButton" class="btn btn-primary" aria-label="Comenzar chat">Comenzar chat</button>
    </div>

    <!-- Contenedor del Chat -->
    <div class="chat-container flex-grow-1" style="display: none;">
        <div class="chat-box">
            <!-- Título del Chat -->
            <h1 class="chatbot-title">Gym Coach</h1>
            <!-- Salida del Chat -->
            <div class="chat-output" id="chatOutput">
                <!-- Los mensajes se insertarán dinámicamente aquí -->
            </div>
            <!-- Animación de Escritura (si aplica) -->
            <div class="typing-animation" id="typingAnimation" style="display: none;">
                Gym Coach está escribiendo
                <span class="dot">.</span>
                <span class="dot">.</span>
                <span class="dot">.</span>
            </div>
            <!-- Respuestas Rápidas (si aplica) -->
            <div class="quick-replies" id="quickReplies" style="display: none;"></div>
            <!-- Contenedor de Entrada de Chat -->
            <div class="chat-input-container">
                <form id="chatForm" class="d-flex justify-content-between"> 
                    <textarea class="chat-input form-control" id="chatInput" placeholder="Escribe un mensaje..."></textarea>
                    <button type="submit" id="sendButton" class="btn btn-primary" aria-label="Enviar mensaje">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Sonido de Notificación -->
    <audio id="sendSound" src="{{ url_for('static', filename='audio/notification_audio.mp3') }}" preload="auto"></audio>

    <!-- Pie de Página -->
    <footer class="text-center mt-4 d-flex align-items-center justify-content-center">
        &copy; 2024 Gym Coach. Todos los derechos reservados.
    </footer>
    
    <!-- JavaScript Externo -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <!-- Script de Animación del Título -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const title = document.getElementById("chatbotTitle");
            const text = title.textContent;
            title.textContent = "";
            
            let index = 0;
            
            function typeTitle() {
                if (index < text.length) {
                    title.textContent += text[index];
                    index++;
                    setTimeout(typeTitle, 150);
                } else {
                    title.style.animation = "blink 0.5s step-end infinite";
                }
            }
        
            typeTitle();
        });
    </script>
</body>
</html>
